name: Auto Generate and Build Plugin JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21 (for Gradle runner)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Generate Project Files and Compile
        run: |
          rm -rf *
          mkdir -p src/main/java/me/example/snowchunks
          mkdir -p src/main/resources

          METADATA=$(curl -s https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml)
          PAPER_VER=$(echo "$METADATA" | grep -oP '(?<=<version>)[^<]+' | grep '^26\.3' | tail -n 1 || true)
          if [ -z "$PAPER_VER" ]; then
            PAPER_VER=$(echo "$METADATA" | grep -oP '(?<=<version>)[^<]+' | grep '^26\.' | tail -n 1 || true)
          fi
          if [ -z "$PAPER_VER" ]; then
            PAPER_VER=$(echo "$METADATA" | grep -oP '(?<=<version>)[^<]+' | grep '^1\.21' | tail -n 1 || true)
          fi
          if [ -z "$PAPER_VER" ]; then
            PAPER_VER="1.21.4-R0.1-SNAPSHOT"
          fi

          if [[ "$PAPER_VER" == 26.* ]]; then
            JAVA_VER=25
          else
            JAVA_VER=21
          fi

          cat << 'EOF' > settings.gradle.kts
          plugins {
              id("org.gradle.toolchains.foojay-resolver-convention") version "0.9.0"
          }
          rootProject.name = "SnowChunks"
          EOF

          cat << EOF > build.gradle.kts
          plugins {
              java
          }

          group = "me.example"
          version = "1.4.1"

          repositories {
              mavenCentral()
              maven("https://repo.papermc.io/repository/maven-public/")
          }

          dependencies {
              compileOnly("io.papermc.paper:paper-api:$PAPER_VER")
          }

          java {
              toolchain.languageVersion.set(JavaLanguageVersion.of($JAVA_VER))
          }

          tasks.withType<JavaCompile> {
              options.encoding = "UTF-8"
          }
          EOF

          cat << 'EOF' > src/main/resources/plugin.yml
          name: SnowChunks
          version: '1.4.1'
          main: me.example.snowchunks.SnowChunksPlugin
          api-version: '1.21'
          description: Снег в чанках с правильным визуалом снегопада и фиксом дождя
          commands:
            snowchunks:
              aliases: [sc, snowchunk]
              description: Управление снежными чанками и осадками
              permission: snowchunks.admin
          permissions:
            snowchunks.admin:
              description: Полный доступ к командам SnowChunks
              default: op
          EOF

          cat << 'EOF' > src/main/resources/config.yml
          snow-biome: "minecraft:snowy_plains"
          fallback-rain-biome: "minecraft:plains"
          per-chunk-roll: false

          accumulation:
            allow-snow-layers: true
            allow-ice-form: false

          snowdrifts:
            enabled: true
            max-layers: 7
            interval-ticks: 20
            attempts-per-chunk: 10
            growth-chance: 0.45

          melting:
            enabled: true
            only-daytime: false
            attempts-per-chunk: 12
            melt-chance: 0.55

          visualizer:
            enabled: true
            interval-ticks: 10
            chunk-radius: 3
            step-blocks: 2
            show-inner-grid: true
            show-actionbar: true

          probabilities:
            snow: 65
            rain: 20
            thunder: 10
            clear: 5

          chunks: []
          EOF

          cat << 'EOF' > src/main/java/me/example/snowchunks/WeatherMode.java
          package me.example.snowchunks;

          public enum WeatherMode {
              SNOW,
              RAIN,
              THUNDER,
              CLEAR
          }
          EOF

          cat << 'EOF' > src/main/java/me/example/snowchunks/SnowChunksPlugin.java
          package me.example.snowchunks;

          import org.bukkit.command.PluginCommand;
          import org.bukkit.plugin.java.JavaPlugin;
          import org.bukkit.scheduler.BukkitTask;

          public final class SnowChunksPlugin extends JavaPlugin {

              private ChunkWeatherManager weatherManager;
              private BukkitTask physicsTask;
              private BukkitTask visualizerTask;
              private WandVisualizerTask visualizerRunner;

              @Override
              public void onEnable() {
                  saveDefaultConfig();

                  this.weatherManager = new ChunkWeatherManager(this);
                  this.weatherManager.loadChunksFromConfig();
                  this.visualizerRunner = new WandVisualizerTask(this, weatherManager);

                  getServer().getPluginManager().registerEvents(new WeatherListener(this, weatherManager, visualizerRunner), this);

                  SnowCommand commandExecutor = new SnowCommand(this, weatherManager);
                  PluginCommand cmd = getCommand("snowchunks");
                  if (cmd != null) {
                      cmd.setExecutor(commandExecutor);
                      cmd.setTabCompleter(commandExecutor);
                  }

                  startTasks();
                  getLogger().info("SnowChunks v1.4.1 успешно запущен!");
              }

              public void startTasks() {
                  if (physicsTask != null) {
                      physicsTask.cancel();
                  }
                  if (visualizerTask != null) {
                      visualizerTask.cancel();
                  }

                  long physInterval = Math.max(1L, getConfig().getLong("snowdrifts.interval-ticks", 20L));
                  SnowPhysicsTask physRunner = new SnowPhysicsTask(this, weatherManager);
                  this.physicsTask = getServer().getScheduler().runTaskTimer(this, physRunner, physInterval, physInterval);

                  long visInterval = Math.max(4L, getConfig().getLong("visualizer.interval-ticks", 10L));
                  this.visualizerRunner = new WandVisualizerTask(this, weatherManager);
                  this.visualizerTask = getServer().getScheduler().runTaskTimer(this, visualizerRunner, visInterval, visInterval);
              }

              @Override
              public void onDisable() {
                  if (physicsTask != null) {
                      physicsTask.cancel();
                  }
                  if (visualizerTask != null) {
                      visualizerTask.cancel();
                  }
                  if (weatherManager != null) {
                      weatherManager.resetAllPlayerWeather();
                  }
              }

              public ChunkWeatherManager getWeatherManager() {
                  return weatherManager;
              }

              public WandVisualizerTask getVisualizerRunner() {
                  return visualizerRunner;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/me/example/snowchunks/ChunkWeatherManager.java
          package me.example.snowchunks;

          import io.papermc.paper.registry.RegistryAccess;
          import io.papermc.paper.registry.RegistryKey;
          import org.bukkit.Bukkit;
          import org.bukkit.Chunk;
          import org.bukkit.HeightMap;
          import org.bukkit.Material;
          import org.bukkit.NamespacedKey;
          import org.bukkit.Registry;
          import org.bukkit.WeatherType;
          import org.bukkit.World;
          import org.bukkit.block.Biome;
          import org.bukkit.block.Block;
          import org.bukkit.configuration.ConfigurationSection;
          import org.bukkit.entity.Player;
          import org.bukkit.inventory.ItemStack;
          import org.bukkit.persistence.PersistentDataContainer;
          import org.bukkit.persistence.PersistentDataType;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;
          import java.util.concurrent.ThreadLocalRandom;

          public class ChunkWeatherManager {

              private final SnowChunksPlugin plugin;
              private final NamespacedKey origBiomesKey;
              private final NamespacedKey wandKey;

              private final Set<String> selectedChunks = new HashSet<>();
              private final Map<String, WeatherMode> chunkModes = new HashMap<>();
              private WeatherMode globalRolledMode = WeatherMode.SNOW;
              private long stormSeed = ThreadLocalRandom.current().nextLong();

              public ChunkWeatherManager(SnowChunksPlugin plugin) {
                  this.plugin = plugin;
                  this.origBiomesKey = new NamespacedKey(plugin, "original_surface_biomes");
                  this.wandKey = new NamespacedKey(plugin, "chunk_selector_wand");
              }

              public NamespacedKey getWandKey() {
                  return wandKey;
              }

              public long getStormSeed() {
                  return stormSeed;
              }

              public WeatherMode getGlobalRolledMode() {
                  return globalRolledMode;
              }

              public boolean isWandItem(ItemStack item) {
                  if (item == null || !item.hasItemMeta()) return false;
                  return item.getItemMeta().getPersistentDataContainer().has(wandKey, PersistentDataType.BYTE);
              }

              public boolean isHoldingWand(Player player) {
                  return isWandItem(player.getInventory().getItemInMainHand())
                          || isWandItem(player.getInventory().getItemInOffHand());
              }

              public String toKey(World world, int chunkX, int chunkZ) {
                  return world.getName() + ":" + chunkX + ":" + chunkZ;
              }

              public String toKey(Chunk chunk) {
                  return toKey(chunk.getWorld(), chunk.getX(), chunk.getZ());
              }

              public void loadChunksFromConfig() {
                  selectedChunks.clear();
                  chunkModes.clear();
                  List<String> list = plugin.getConfig().getStringList("chunks");
                  selectedChunks.addAll(list);
                  rollWeatherForAllChunks();
              }

              public void saveChunksToConfig() {
                  plugin.getConfig().set("chunks", new ArrayList<>(selectedChunks));
                  plugin.saveConfig();
              }

              public boolean isManagedChunk(Chunk chunk) {
                  return selectedChunks.contains(toKey(chunk));
              }

              public boolean isManagedChunk(World world, int chunkX, int chunkZ) {
                  return selectedChunks.contains(toKey(world, chunkX, chunkZ));
              }

              public Set<String> getSelectedChunks() {
                  return Collections.unmodifiableSet(selectedChunks);
              }

              public WeatherMode getChunkMode(Chunk chunk) {
                  String key = toKey(chunk);
                  if (plugin.getConfig().getBoolean("per-chunk-roll", false)) {
                      return chunkModes.computeIfAbsent(key, k -> rollSingleProbability());
                  }
                  return globalRolledMode;
              }

              public boolean addChunk(Chunk chunk) {
                  String key = toKey(chunk);
                  if (!selectedChunks.add(key)) {
                      return false;
                  }
                  backupOriginalBiomes(chunk);
                  WeatherMode mode = getChunkMode(chunk);
                  applyChunkBiomeForMode(chunk, mode);
                  updatePlayersInChunk(chunk);
                  saveChunksToConfig();
                  return true;
              }

              public boolean removeChunk(Chunk chunk) {
                  String key = toKey(chunk);
                  if (!selectedChunks.remove(key)) {
                      return false;
                  }
                  chunkModes.remove(key);
                  restoreOriginalBiomes(chunk);
                  for (Player player : chunk.getWorld().getPlayers()) {
                      if (player.getLocation().getChunk().equals(chunk)) {
                          player.resetPlayerWeather();
                      }
                  }
                  saveChunksToConfig();
                  return true;
              }

              public WeatherMode rollSingleProbability() {
                  ConfigurationSection sec = plugin.getConfig().getConfigurationSection("probabilities");
                  double snow = sec != null ? Math.max(0, sec.getDouble("snow", 65)) : 65;
                  double rain = sec != null ? Math.max(0, sec.getDouble("rain", 20)) : 20;
                  double thunder = sec != null ? Math.max(0, sec.getDouble("thunder", 10)) : 10;
                  double clear = sec != null ? Math.max(0, sec.getDouble("clear", 5)) : 5;

                  double total = snow + rain + thunder + clear;
                  if (total <= 0) {
                      return WeatherMode.SNOW;
                  }

                  double roll = ThreadLocalRandom.current().nextDouble(total);
                  if (roll < snow) return WeatherMode.SNOW;
                  roll -= snow;
                  if (roll < rain) return WeatherMode.RAIN;
                  roll -= rain;
                  if (roll < thunder) return WeatherMode.THUNDER;
                  return WeatherMode.CLEAR;
              }

              public WeatherMode rollWeatherForAllChunks() {
                  this.stormSeed = ThreadLocalRandom.current().nextLong();
                  this.globalRolledMode = rollSingleProbability();
                  chunkModes.clear();

                  for (String key : selectedChunks) {
                      WeatherMode mode = plugin.getConfig().getBoolean("per-chunk-roll", false)
                              ? rollSingleProbability()
                              : globalRolledMode;
                      chunkModes.put(key, mode);
                      applyToLoadedChunkKey(key, mode);
                  }
                  return globalRolledMode;
              }

              public void forceWeatherMode(WeatherMode mode) {
                  this.stormSeed = ThreadLocalRandom.current().nextLong();
                  this.globalRolledMode = mode;
                  for (String key : selectedChunks) {
                      chunkModes.put(key, mode);
                      applyToLoadedChunkKey(key, mode);
                  }
              }

              public int clearSnowInManagedChunks() {
                  int clearedBlocks = 0;
                  for (String key : selectedChunks) {
                      String[] parts = key.split(":");
                      if (parts.length != 3) continue;
                      World world = Bukkit.getWorld(parts[0]);
                      if (world == null) continue;
                      try {
                          int cx = Integer.parseInt(parts[1]);
                          int cz = Integer.parseInt(parts[2]);
                          if (!world.isChunkLoaded(cx, cz)) continue;
                          int baseX = cx << 4;
                          int baseZ = cz << 4;
                          for (int lx = 0; lx < 16; lx++) {
                              for (int lz = 0; lz < 16; lz++) {
                                  Block snow = findSurfaceSnowBlock(world, baseX + lx, baseZ + lz);
                                  if (snow != null) {
                                      snow.setType(Material.AIR, true);
                                      clearedBlocks++;
                                  }
                              }
                          }
                      } catch (NumberFormatException ignored) {
                      }
                  }
                  return clearedBlocks;
              }

              public Block findSurfaceSnowBlock(World world, int wx, int wz) {
                  int ySurface = world.getHighestBlockYAt(wx, wz, HeightMap.WORLD_SURFACE);
                  Block b1 = world.getBlockAt(wx, ySurface, wz);
                  if (b1.getType() == Material.SNOW) {
                      return b1;
                  }
                  int yMotion = world.getHighestBlockYAt(wx, wz, HeightMap.MOTION_BLOCKING);
                  Block b2 = world.getBlockAt(wx, yMotion, wz);
                  if (b2.getType() == Material.SNOW) {
                      return b2;
                  }
                  Block b3 = b2.getRelative(0, 1, 0);
                  if (b3.getType() == Material.SNOW) {
                      return b3;
                  }
                  return null;
              }

              private void applyToLoadedChunkKey(String key, WeatherMode mode) {
                  String[] parts = key.split(":");
                  if (parts.length != 3) return;

                  World world = Bukkit.getWorld(parts[0]);
                  if (world == null) return;

                  try {
                      int cx = Integer.parseInt(parts[1]);
                      int cz = Integer.parseInt(parts[2]);
                      if (world.isChunkLoaded(cx, cz)) {
                          Chunk chunk = world.getChunkAt(cx, cz);
                          applyChunkBiomeForMode(chunk, mode);
                          updatePlayersInChunk(chunk);
                      }
                  } catch (NumberFormatException ignored) {
                  }
              }

              public void backupOriginalBiomes(Chunk chunk) {
                  PersistentDataContainer pdc = chunk.getPersistentDataContainer();
                  if (pdc.has(origBiomesKey, PersistentDataType.STRING)) {
                      return;
                  }

                  World world = chunk.getWorld();
                  int baseX = chunk.getX() << 4;
                  int baseZ = chunk.getZ() << 4;
                  Registry<Biome> registry = RegistryAccess.registryAccess().getRegistry(RegistryKey.BIOME);

                  StringBuilder sb = new StringBuilder();
                  for (int lx = 0; lx < 16; lx += 4) {
                      for (int lz = 0; lz < 16; lz += 4) {
                          int wx = baseX + lx;
                          int wz = baseZ + lz;
                          int surfaceY = world.getHighestBlockYAt(wx, wz);
                          Biome biome = world.getBiome(wx, surfaceY, wz);
                          NamespacedKey bKey = registry.getKey(biome);
                          if (!sb.isEmpty()) sb.append(",");
                          sb.append(bKey != null ? bKey.asString() : "minecraft:plains");
                      }
                  }
                  pdc.set(origBiomesKey, PersistentDataType.STRING, sb.toString());
              }

              public void applyChunkBiomeForMode(Chunk chunk, WeatherMode mode) {
                  backupOriginalBiomes(chunk);
                  World world = chunk.getWorld();

                  if (mode == WeatherMode.SNOW || mode == WeatherMode.THUNDER) {
                      Biome snowBiome = resolveBiome(plugin.getConfig().getString("snow-biome", "minecraft:snowy_plains"), Biome.SNOWY_PLAINS);
                      // Устанавливаем снежный биом только на небе (y >= surfaceY + 4), чтобы клиент рендерил снег,
                      // но нижняя часть мира и поверхность земли сохраняли родной биом (и родной цвет травы/воды)
                      setSkyOnlyBiome(chunk, snowBiome);
                      if (mode == WeatherMode.THUNDER && world.hasStorm() && !world.isThundering()) {
                          world.setThundering(true);
                      }
                  } else if (mode == WeatherMode.RAIN) {
                      restoreOrFallbackRainBiome(chunk);
                  } else if (mode == WeatherMode.CLEAR) {
                      restoreOriginalBiomesWithoutRemove(chunk);
                  }
              }

              private void setSkyOnlyBiome(Chunk chunk, Biome targetBiome) {
                  World world = chunk.getWorld();
                  int baseX = chunk.getX() << 4;
                  int baseZ = chunk.getZ() << 4;
                  int maxY = world.getMaxHeight();
                  int minY = world.getMinHeight();

                  for (int lx = 0; lx < 16; lx += 4) {
                      for (int lz = 0; lz < 16; lz += 4) {
                          int wx = baseX + lx;
                          int wz = baseZ + lz;
                          int surfaceY = world.getHighestBlockYAt(wx, wz);
                          // Меняем биом только в воздухе над землей, оставляя поверхность в покое
                          int startY = Math.max(minY, surfaceY + 4);
                          for (int y = startY; y < maxY; y += 4) {
                              world.setBiome(wx, y, wz, targetBiome);
                          }
                      }
                  }
                  world.refreshChunk(chunk.getX(), chunk.getZ());
              }

              private void restoreOrFallbackRainBiome(Chunk chunk) {
                  PersistentDataContainer pdc = chunk.getPersistentDataContainer();
                  String saved = pdc.get(origBiomesKey, PersistentDataType.STRING);
                  Biome fallbackRain = resolveBiome(plugin.getConfig().getString("fallback-rain-biome", "minecraft:plains"), Biome.PLAINS);

                  if (saved == null || saved.isEmpty()) {
                      setSkyOnlyBiome(chunk, fallbackRain);
                      return;
                  }

                  String[] keys = saved.split(",");
                  World world = chunk.getWorld();
                  int baseX = chunk.getX() << 4;
                  int baseZ = chunk.getZ() << 4;
                  int maxY = world.getMaxHeight();
                  int minY = world.getMinHeight();

                  int idx = 0;
                  for (int lx = 0; lx < 16; lx += 4) {
                      for (int lz = 0; lz < 16; lz += 4) {
                          Biome orig = idx < keys.length ? resolveBiome(keys[idx], fallbackRain) : fallbackRain;
                          idx++;
                          int wx = baseX + lx;
                          int wz = baseZ + lz;
                          int surfaceY = world.getHighestBlockYAt(wx, wz);
                          int startY = Math.max(minY, surfaceY + 4);
                          for (int y = startY; y < maxY; y += 4) {
                              world.setBiome(wx, y, wz, orig);
                          }
                      }
                  }
                  world.refreshChunk(chunk.getX(), chunk.getZ());
              }

              private void restoreOriginalBiomesWithoutRemove(Chunk chunk) {
                  PersistentDataContainer pdc = chunk.getPersistentDataContainer();
                  String saved = pdc.get(origBiomesKey, PersistentDataType.STRING);
                  if (saved == null || saved.isEmpty()) return;

                  String[] keys = saved.split(",");
                  World world = chunk.getWorld();
                  int baseX = chunk.getX() << 4;
                  int baseZ = chunk.getZ() << 4;
                  int maxY = world.getMaxHeight();
                  int minY = world.getMinHeight();

                  int idx = 0;
                  for (int lx = 0; lx < 16; lx += 4) {
                      for (int lz = 0; lz < 16; lz += 4) {
                          if (idx >= keys.length) break;
                          Biome orig = resolveBiome(keys[idx++], Biome.PLAINS);
                          int wx = baseX + lx;
                          int wz = baseZ + lz;
                          int surfaceY = world.getHighestBlockYAt(wx, wz);
                          int startY = Math.max(minY, surfaceY + 4);
                          for (int y = startY; y < maxY; y += 4) {
                              world.setBiome(wx, y, wz, orig);
                          }
                      }
                  }
                  world.refreshChunk(chunk.getX(), chunk.getZ());
              }

              public void restoreOriginalBiomes(Chunk chunk) {
                  restoreOriginalBiomesWithoutRemove(chunk);
                  chunk.getPersistentDataContainer().remove(origBiomesKey);
              }

              public void updatePlayersInChunk(Chunk chunk) {
                  for (Player player : chunk.getWorld().getPlayers()) {
                      if (player.getLocation().getChunk().equals(chunk)) {
                          updatePlayerWeather(player, chunk);
                      }
                  }
              }

              public void updatePlayerWeather(Player player, Chunk chunk) {
                  if (!isManagedChunk(chunk)) {
                      if (player.getPlayerWeather() != null) {
                          player.resetPlayerWeather();
                      }
                      return;
                  }

                  WeatherMode mode = getChunkMode(chunk);
                  if (mode == WeatherMode.CLEAR && chunk.getWorld().hasStorm()) {
                      player.setPlayerWeather(WeatherType.CLEAR);
                  } else {
                      if (player.getPlayerWeather() != null) {
                          player.resetPlayerWeather();
                      }
                  }
              }

              public void resetAllPlayerWeather() {
                  for (Player player : Bukkit.getOnlinePlayers()) {
                      if (player.getPlayerWeather() != null) {
                          player.resetPlayerWeather();
                      }
                  }
              }

              private Biome resolveBiome(String keyString, Biome defaultBiome) {
                  if (keyString == null) return defaultBiome;
                  NamespacedKey key = NamespacedKey.fromString(keyString.toLowerCase());
                  if (key == null) return defaultBiome;
                  Biome biome = RegistryAccess.registryAccess().getRegistry(RegistryKey.BIOME).get(key);
                  return biome != null ? biome : defaultBiome;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/me/example/snowchunks/WandVisualizerTask.java
          package me.example.snowchunks;

          import net.kyori.adventure.text.Component;
          import net.kyori.adventure.text.format.NamedTextColor;
          import org.bukkit.Bukkit;
          import org.bukkit.Chunk;
          import org.bukkit.HeightMap;
          import org.bukkit.Particle;
          import org.bukkit.World;
          import org.bukkit.entity.Player;

          public class WandVisualizerTask implements Runnable {

              private final SnowChunksPlugin plugin;
              private final ChunkWeatherManager manager;

              public WandVisualizerTask(SnowChunksPlugin plugin, ChunkWeatherManager manager) {
                  this.plugin = plugin;
                  this.manager = manager;
              }

              @Override
              public void run() {
                  if (!plugin.getConfig().getBoolean("visualizer.enabled", true)) {
                      return;
                  }

                  int radius = Math.max(1, Math.min(6, plugin.getConfig().getInt("visualizer.chunk-radius", 3)));
                  int step = Math.max(1, Math.min(8, plugin.getConfig().getInt("visualizer.step-blocks", 2)));
                  boolean showInnerGrid = plugin.getConfig().getBoolean("visualizer.show-inner-grid", true);
                  boolean showActionbar = plugin.getConfig().getBoolean("visualizer.show-actionbar", true);

                  for (Player player : Bukkit.getOnlinePlayers()) {
                      if (!player.hasPermission("snowchunks.admin")) continue;
                      if (!manager.isHoldingWand(player)) continue;

                      World world = player.getWorld();
                      Chunk playerChunk = player.getLocation().getChunk();
                      int centerX = playerChunk.getX();
                      int centerZ = playerChunk.getZ();

                      if (showActionbar) {
                          sendChunkStatusActionBar(player, playerChunk);
                      }

                      for (int dx = -radius; dx <= radius; dx++) {
                          for (int dz = -radius; dz <= radius; dz++) {
                              int cx = centerX + dx;
                              int cz = centerZ + dz;
                              if (!manager.isManagedChunk(world, cx, cz)) continue;
                              if (!world.isChunkLoaded(cx, cz)) continue;

                              renderChunkBorders(player, world, cx, cz, step, showInnerGrid);
                          }
                      }
                  }
              }

              private void sendChunkStatusActionBar(Player player, Chunk chunk) {
                  boolean managed = manager.isManagedChunk(chunk);
                  if (managed) {
                      WeatherMode mode = manager.getChunkMode(chunk);
                      player.sendActionBar(
                              Component.text("Чанк [" + chunk.getX() + ", " + chunk.getZ() + "]: ", NamedTextColor.GRAY)
                                      .append(Component.text("❄ Снежная зона ", NamedTextColor.AQUA))
                                      .append(Component.text("(Режим: " + mode.name() + " | ЛКМ — удалить)", NamedTextColor.WHITE))
                      );
                  } else {
                      player.sendActionBar(
                              Component.text("Чанк [" + chunk.getX() + ", " + chunk.getZ() + "]: ", NamedTextColor.GRAY)
                                      .append(Component.text("Обычная зона ", NamedTextColor.YELLOW))
                                      .append(Component.text("(ПКМ — сделать снежной)", NamedTextColor.WHITE))
                      );
                  }
              }

              private void renderChunkBorders(Player player, World world, int cx, int cz, int step, boolean showInnerGrid) {
                  int minX = cx << 4;
                  int minZ = cz << 4;
                  int maxX = minX + 16;
                  int maxZ = minZ + 16;

                  boolean northManaged = manager.isManagedChunk(world, cx, cz - 1);
                  boolean southManaged = manager.isManagedChunk(world, cx, cz + 1);
                  boolean westManaged = manager.isManagedChunk(world, cx - 1, cz);
                  boolean eastManaged = manager.isManagedChunk(world, cx + 1, cz);

                  if (!northManaged || showInnerGrid) {
                      for (int x = minX; x <= maxX; x += step) {
                          spawnBorderPoint(player, world, x, minZ, !northManaged);
                      }
                  }
                  if (!southManaged) {
                      for (int x = minX; x <= maxX; x += step) {
                          spawnBorderPoint(player, world, x, maxZ, true);
                      }
                  }
                  if (!westManaged || showInnerGrid) {
                      for (int z = minZ; z <= maxZ; z += step) {
                          spawnBorderPoint(player, world, minX, z, !westManaged);
                      }
                  }
                  if (!eastManaged) {
                      for (int z = minZ; z <= maxZ; z += step) {
                          spawnBorderPoint(player, world, maxX, z, true);
                      }
                  }
              }

              private void spawnBorderPoint(Player player, World world, double wx, double wz, boolean isOuterBorder) {
                  int blockX = (int) Math.floor(wx);
                  int blockZ = (int) Math.floor(wz);
                  int surfaceY = world.getHighestBlockYAt(blockX, blockZ, HeightMap.WORLD_SURFACE);
                  double baseY = surfaceY + 1.15;
                  double playerEyeY = player.getLocation().getY() + 1.0;

                  if (isOuterBorder) {
                      player.spawnParticle(Particle.END_ROD, wx, baseY, wz, 1, 0, 0, 0, 0);
                      player.spawnParticle(Particle.SNOWFLAKE, wx, baseY + 1.0, wz, 1, 0.05, 0.05, 0.05, 0);
                      player.spawnParticle(Particle.END_ROD, wx, baseY + 2.0, wz, 1, 0, 0, 0, 0);

                      if (Math.abs(playerEyeY - baseY) > 6.0) {
                          player.spawnParticle(Particle.END_ROD, wx, playerEyeY, wz, 1, 0, 0, 0, 0);
                      }
                  } else {
                      player.spawnParticle(Particle.SNOWFLAKE, wx, baseY, wz, 1, 0, 0, 0, 0);
                      if (Math.abs(playerEyeY - baseY) > 6.0) {
                          player.spawnParticle(Particle.SNOWFLAKE, wx, playerEyeY, wz, 1, 0, 0, 0, 0);
                      }
                  }
              }

              public void spawnInstantChunkFeedback(Player player, Chunk chunk, boolean added) {
                  World world = chunk.getWorld();
                  int minX = chunk.getX() << 4;
                  int minZ = chunk.getZ() << 4;
                  int maxX = minX + 16;
                  int maxZ = minZ + 16;
                  Particle feedbackParticle = added ? Particle.END_ROD : Particle.CLOUD;

                  for (int i = 0; i <= 16; i += 2) {
                      spawnFeedbackColumn(player, world, minX + i, minZ, feedbackParticle);
                      spawnFeedbackColumn(player, world, minX + i, maxZ, feedbackParticle);
                      spawnFeedbackColumn(player, world, minX, minZ + i, feedbackParticle);
                      spawnFeedbackColumn(player, world, maxX, minZ + i, feedbackParticle);
                  }
              }

              private void spawnFeedbackColumn(Player player, World world, double wx, double wz, Particle particle) {
                  int surfaceY = world.getHighestBlockYAt((int) wx, (int) wz, HeightMap.WORLD_SURFACE);
                  double baseY = surfaceY + 1.2;
                  player.spawnParticle(particle, wx, baseY, wz, 2, 0.05, 0.3, 0.05, 0.01);
                  player.spawnParticle(particle, wx, baseY + 1.5, wz, 2, 0.05, 0.3, 0.05, 0.01);
              }
          }
