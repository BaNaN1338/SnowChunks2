          package me.example.snowchunks;

          import org.bukkit.Bukkit;
          import org.bukkit.Chunk;
          import org.bukkit.HeightMap;
          import org.bukkit.Material;
          import org.bukkit.World;
          import org.bukkit.block.Block;
          import org.bukkit.block.data.BlockData;
          import org.bukkit.block.data.type.Snow;

          import java.util.concurrent.ThreadLocalRandom;

          public class SnowPhysicsTask implements Runnable {

              private final SnowChunksPlugin plugin;
              private final ChunkWeatherManager manager;
              private int sweepSlice = 0;

              public SnowPhysicsTask(SnowChunksPlugin plugin, ChunkWeatherManager manager) {
                  this.plugin = plugin;
                  this.manager = manager;
              }

              @Override
              public void run() {
                  sweepSlice = (sweepSlice + 1) & 15;

                  boolean driftsEnabled = plugin.getConfig().getBoolean("snowdrifts.enabled", true);
                  boolean allowSnowLayers = plugin.getConfig().getBoolean("accumulation.allow-snow-layers", true);
                  int maxLayers = Math.max(1, Math.min(7, plugin.getConfig().getInt("snowdrifts.max-layers", 7)));
                  int driftAttempts = Math.max(0, plugin.getConfig().getInt("snowdrifts.attempts-per-chunk", 10));
                  double growthChance = plugin.getConfig().getDouble("snowdrifts.growth-chance", 0.45);

                  boolean meltingEnabled = plugin.getConfig().getBoolean("melting.enabled", true);
                  boolean onlyDaytime = plugin.getConfig().getBoolean("melting.only-daytime", false);
                  int meltAttempts = Math.max(0, plugin.getConfig().getInt("melting.attempts-per-chunk", 12));
                  double meltChance = plugin.getConfig().getDouble("melting.melt-chance", 0.55);

                  for (String key : manager.getSelectedChunks()) {
                      String[] parts = key.split(":");
                      if (parts.length != 3) continue;

                      World world = Bukkit.getWorld(parts[0]);
                      if (world == null) continue;

                      int cx;
                      int cz;
                      try {
                          cx = Integer.parseInt(parts[1]);
                          cz = Integer.parseInt(parts[2]);
                      } catch (NumberFormatException e) {
                          continue;
                      }

                      if (!world.isChunkLoaded(cx, cz)) continue;
                      Chunk chunk = world.getChunkAt(cx, cz);
                      WeatherMode mode = manager.getChunkMode(chunk);

                      boolean isSnowingInChunk = world.hasStorm()
                              && (mode == WeatherMode.SNOW || mode == WeatherMode.THUNDER);

                      if (isSnowingInChunk) {
                          if (driftsEnabled && allowSnowLayers && driftAttempts > 0) {
                              int effectiveAttempts = (mode == WeatherMode.THUNDER) ? driftAttempts * 2 : driftAttempts;
                              growSnowdriftsInChunk(world, cx, cz, maxLayers, effectiveAttempts, growthChance);
                          }
                      } else {
                          if (meltingEnabled && meltAttempts > 0) {
                              boolean isRainingInChunk = world.hasStorm() && mode == WeatherMode.RAIN;
                              if (onlyDaytime && !isRainingInChunk && !world.isDayTime()) {
                                  continue;
                              }
                              double effectiveMeltChance = isRainingInChunk ? Math.min(1.0, meltChance * 1.5) : meltChance;
                              meltSnowInChunk(world, cx, cz, meltAttempts, effectiveMeltChance);
                          }
                      }
                  }
              }

              private void growSnowdriftsInChunk(World world, int cx, int cz, int configuredMaxLayers, int attempts, double chance) {
                  ThreadLocalRandom random = ThreadLocalRandom.current();
                  int baseX = cx << 4;
                  int baseZ = cz << 4;

                  for (int i = 0; i < attempts; i++) {
                      if (random.nextDouble() > chance) continue;

                      int wx = baseX + random.nextInt(16);
                      int wz = baseZ + random.nextInt(16);

                      int targetMaxLayers = getRandomMaxLayersForColumn(wx, wz, configuredMaxLayers);

                      Block snowBlock = manager.findSurfaceSnowBlock(world, wx, wz);
                      if (snowBlock != null) {
                          if (snowBlock.getLightFromBlocks() > 11) continue;
                          if (snowBlock.getBlockData() instanceof Snow snowData) {
                              int current = snowData.getLayers();
                              int limit = Math.min(targetMaxLayers, Math.min(7, snowData.getMaximumLayers()));
                              if (current < limit) {
                                  snowData.setLayers(current + 1);
                                  snowBlock.setBlockData(snowData, true);
                              }
                          }
                      } else {
                          int yMotion = world.getHighestBlockYAt(wx, wz, HeightMap.MOTION_BLOCKING);
                          Block ground = world.getBlockAt(wx, yMotion, wz);
                          if (!ground.getType().isSolid() || ground.isLiquid()) continue;

                          Block above = ground.getRelative(0, 1, 0);
                          if (above.getType() == Material.AIR && above.getLightFromBlocks() <= 11) {
                              BlockData newSnow = Bukkit.createBlockData(Material.SNOW);
                              if (above.canPlace(newSnow)) {
                                  above.setBlockData(newSnow, true);
                              }
                          }
                      }
                  }
              }

              private void meltSnowInChunk(World world, int cx, int cz, int attempts, double chance) {
                  ThreadLocalRandom random = ThreadLocalRandom.current();
                  int baseX = cx << 4;
                  int baseZ = cz << 4;
                  int meltedCount = 0;

                  for (int i = 0; i < attempts; i++) {
                      if (random.nextDouble() > chance) continue;
                      int wx = baseX + random.nextInt(16);
                      int wz = baseZ + random.nextInt(16);

                      if (meltSingleColumn(world, wx, wz)) {
                          meltedCount++;
                      }
                  }

                  if (meltedCount == 0 && random.nextDouble() <= chance) {
                      int wx = baseX + sweepSlice;
                      for (int lz = 0; lz < 16; lz++) {
                          if (meltSingleColumn(world, wx, baseZ + lz)) {
                              break;
                          }
                      }
                  }
              }

              private boolean meltSingleColumn(World world, int wx, int wz) {
                  Block snowBlock = manager.findSurfaceSnowBlock(world, wx, wz);
                  if (snowBlock == null) return false;

                  if (snowBlock.getBlockData() instanceof Snow snowData) {
                      int current = snowData.getLayers();
                      if (current > 1) {
                          snowData.setLayers(current - 1);
                          snowBlock.setBlockData(snowData, true);
                      } else {
                          snowBlock.setType(Material.AIR, true);
                      }
                  } else {
                      snowBlock.setType(Material.AIR, true);
                  }
                  return true;
              }

              private int getRandomMaxLayersForColumn(int wx, int wz, int maxLayers) {
                  if (maxLayers <= 1) return 1;
                  long h = manager.getStormSeed() ^ (wx * 374761393L) ^ (wz * 668265263L);
                  h = (h ^ (h >> 13)) * 1274126177L;
                  h = h ^ (h >> 16);
                  int positive = (int) (h & 0x7FFFFFFF);
                  return 1 + (positive % maxLayers);
              }
          }
