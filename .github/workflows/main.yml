          package me.example.snowchunks;

          import net.kyori.adventure.text.Component;
          import net.kyori.adventure.text.format.NamedTextColor;
          import org.bukkit.Chunk;
          import org.bukkit.Material;
          import org.bukkit.World;
          import org.bukkit.command.Command;
          import org.bukkit.command.CommandExecutor;
          import org.bukkit.command.CommandSender;
          import org.bukkit.command.TabCompleter;
          import org.bukkit.entity.Player;
          import org.bukkit.inventory.ItemStack;
          import org.bukkit.inventory.meta.ItemMeta;
          import org.bukkit.persistence.PersistentDataType;

          import java.util.Arrays;
          import java.util.Collections;
          import java.util.List;

          public class SnowCommand implements CommandExecutor, TabCompleter {

              private final SnowChunksPlugin plugin;
              private final ChunkWeatherManager manager;

              public SnowCommand(SnowChunksPlugin plugin, ChunkWeatherManager manager) {
                  this.plugin = plugin;
                  this.manager = manager;
              }

              @Override
              public boolean onCommand(CommandSender sender, Command command, String label, String[] args) {
                  if (args.length == 0) {
                      sendHelp(sender);
                      return true;
                  }

                  String sub = args[0].toLowerCase();

                  switch (sub) {
                      case "add" -> {
                          if (!(sender instanceof Player player)) {
                              sender.sendMessage(Component.text("Команда только для игроков.", NamedTextColor.RED));
                              return true;
                          }
                          Chunk chunk = player.getLocation().getChunk();
                          if (manager.addChunk(chunk)) {
                              plugin.getVisualizerRunner().spawnInstantChunkFeedback(player, chunk, true);
                              player.sendMessage(Component.text("Чанк [" + chunk.getX() + ", " + chunk.getZ() + "] добавлен!", NamedTextColor.AQUA));
                          } else {
                              player.sendMessage(Component.text("Этот чанк уже добавлен.", NamedTextColor.YELLOW));
                          }
                      }
                      case "remove" -> {
                          if (!(sender instanceof Player player)) {
                              sender.sendMessage(Component.text("Команда только для игроков.", NamedTextColor.RED));
                              return true;
                          }
                          Chunk chunk = player.getLocation().getChunk();
                          if (manager.removeChunk(chunk)) {
                              plugin.getVisualizerRunner().spawnInstantChunkFeedback(player, chunk, false);
                              player.sendMessage(Component.text("Чанк [" + chunk.getX() + ", " + chunk.getZ() + "] удалён, оригинальный биом возвращён.", NamedTextColor.GREEN));
                          } else {
                              player.sendMessage(Component.text("Этот чанк не найден в списке.", NamedTextColor.RED));
                          }
                      }
                      case "addradius" -> {
                          if (!(sender instanceof Player player)) return true;
                          if (args.length < 2) {
                              player.sendMessage(Component.text("Использование: /sc addradius [радиус_в_чанках]", NamedTextColor.RED));
                              return true;
                          }
                          int radius = parseRadius(args[1], player);
                          if (radius < 0) return true;

                          World world = player.getWorld();
                          int centerX = player.getLocation().getChunk().getX();
                          int centerZ = player.getLocation().getChunk().getZ();
                          int added = 0;

                          for (int dx = -radius; dx <= radius; dx++) {
                              for (int dz = -radius; dz <= radius; dz++) {
                                  if (manager.addChunk(world.getChunkAt(centerX + dx, centerZ + dz))) {
                                      added++;
                                  }
                              }
                          }
                          player.sendMessage(Component.text("Добавлено чанков: " + added, NamedTextColor.AQUA));
                      }
                      case "removeradius" -> {
                          if (!(sender instanceof Player player)) return true;
                          if (args.length < 2) {
                              player.sendMessage(Component.text("Использование: /sc removeradius [радиус_в_чанках]", NamedTextColor.RED));
                              return true;
                          }
                          int radius = parseRadius(args[1], player);
                          if (radius < 0) return true;

                          World world = player.getWorld();
                          int centerX = player.getLocation().getChunk().getX();
                          int centerZ = player.getLocation().getChunk().getZ();
                          int removed = 0;

                          for (int dx = -radius; dx <= radius; dx++) {
                              for (int dz = -radius; dz <= radius; dz++) {
                                  if (manager.removeChunk(world.getChunkAt(centerX + dx, centerZ + dz))) {
                                      removed++;
                                  }
                              }
                          }
                          player.sendMessage(Component.text("Удалено и восстановлено чанков: " + removed, NamedTextColor.GREEN));
                      }
                      case "wand" -> {
                          if (!(sender instanceof Player player)) return true;
                          ItemStack wand = new ItemStack(Material.BLAZE_ROD);
                          ItemMeta meta = wand.getItemMeta();
                          meta.displayName(Component.text("Жезл снежных чанков", NamedTextColor.AQUA));
                          meta.lore(List.of(
                                  Component.text("Держите в руке для подсветки границ", NamedTextColor.AQUA),
                                  Component.text("ПКМ — добавить чанк", NamedTextColor.GRAY),
                                  Component.text("ЛКМ — удалить чанк", NamedTextColor.GRAY)
                          ));
                          meta.getPersistentDataContainer().set(manager.getWandKey(), PersistentDataType.BYTE, (byte) 1);
                          wand.setItemMeta(meta);
                          player.getInventory().addItem(wand);
                          player.sendMessage(Component.text("Выдан жезл выделения чанков! Возьмите его в руку, чтобы видеть границы.", NamedTextColor.AQUA));
                      }
                      case "borders" -> {
                          boolean current = plugin.getConfig().getBoolean("visualizer.enabled", true);
                          boolean next = !current;
                          plugin.getConfig().set("visualizer.enabled", next);
                          plugin.saveConfig();
                          sender.sendMessage(Component.text("Подсветка границ чанков жезлом: " + (next ? "ВКЛЮЧЕНА" : "ВЫКЛЮЧЕНА"),
                                  next ? NamedTextColor.GREEN : NamedTextColor.YELLOW));
                      }
                      case "growspeed", "snowspeed" -> handleSpeedCommand(sender, args, true);
                      case "meltspeed" -> handleSpeedCommand(sender, args, false);
                      case "tickrate", "physicsinterval" -> {
                          if (args.length < 2) {
                              sender.sendMessage(Component.text("Использование: /sc tickrate [1-200 тиков] (20 тиков = 1 сек)", NamedTextColor.RED));
                              return true;
                          }
                          try {
                              int ticks = Integer.parseInt(args[1]);
                              if (ticks < 1 || ticks > 200) {
                                  sender.sendMessage(Component.text("Интервал должен быть от 1 до 200 тиков.", NamedTextColor.RED));
                                  return true;
                              }
                              plugin.getConfig().set("snowdrifts.interval-ticks", ticks);
                              plugin.saveConfig();
                              plugin.startTasks();
                              sender.sendMessage(Component.text("Интервал обновления физики снега установлен на " + ticks + " тиков!", NamedTextColor.GREEN));
                          } catch (NumberFormatException e) {
                              sender.sendMessage(Component.text("Введите целое число от 1 до 200.", NamedTextColor.RED));
                          }
                      }
                      case "status", "info" -> sendStatus(sender);
                      case "roll" -> {
                          WeatherMode mode = manager.rollWeatherForAllChunks();
                          sender.sendMessage(Component.text("Вероятности переброшены! Текущий режим: " + mode.name(), NamedTextColor.AQUA));
                      }
                      case "force" -> {
                          if (args.length < 2) {
                              sender.sendMessage(Component.text("Использование: /sc force [snow|rain|thunder|clear]", NamedTextColor.RED));
                              return true;
                          }
                          try {
                              WeatherMode mode = WeatherMode.valueOf(args[1].toUpperCase());
                              manager.forceWeatherMode(mode);
                              sender.sendMessage(Component.text("Принудительно установлен режим осадков: " + mode.name(), NamedTextColor.GREEN));
                          } catch (IllegalArgumentException e) {
                              sender.sendMessage(Component.text("Доступные режимы: snow, rain, thunder, clear", NamedTextColor.RED));
                          }
                      }
                      case "setchance" -> {
                          if (args.length < 3) {
                              sender.sendMessage(Component.text("Использование: /sc setchance [snow|rain|thunder|clear] [вес]", NamedTextColor.RED));
                              return true;
                          }
                          String type = args[1].toLowerCase();
                          if (!List.of("snow", "rain", "thunder", "clear").contains(type)) {
                              sender.sendMessage(Component.text("Неверный тип! Доступны: snow, rain, thunder, clear", NamedTextColor.RED));
                              return true;
                          }
                          try {
                              double val = Double.parseDouble(args[2]);
                              plugin.getConfig().set("probabilities." + type, Math.max(0, val));
                              plugin.saveConfig();
                              sender.sendMessage(Component.text("Вес вероятности для " + type + " установлен на " + val, NamedTextColor.GREEN));
                          } catch (NumberFormatException e) {
                              sender.sendMessage(Component.text("Введите корректное число.", NamedTextColor.RED));
                          }
                      }
                      case "maxlayers" -> {
                          if (args.length < 2) {
                              sender.sendMessage(Component.text("Использование: /sc maxlayers [1-7]", NamedTextColor.RED));
                              return true;
                          }
                          try {
                              int layers = Integer.parseInt(args[1]);
                              if (layers < 1 || layers > 7) {
                                  sender.sendMessage(Component.text("Высота сугробов должна быть от 1 до 7 слоёв.", NamedTextColor.RED));
                                  return true;
                              }
                              plugin.getConfig().set("snowdrifts.max-layers", layers);
                              plugin.saveConfig();
                              sender.sendMessage(Component.text("Максимальная высота сугробов установлена на: " + layers, NamedTextColor.GREEN));
                          } catch (NumberFormatException e) {
                              sender.sendMessage(Component.text("Введите целое число от 1 до 7.", NamedTextColor.RED));
                          }
                      }
                      case "meltsnow" -> {
                          int count = manager.clearSnowInManagedChunks();
                          sender.sendMessage(Component.text("Мгновенно растоплено снежных блоков в выбранных чанках: " + count, NamedTextColor.GREEN));
                      }
                      case "list" -> {
                          sender.sendMessage(Component.text("Выбранные чанки (" + manager.getSelectedChunks().size() + "): "
                                  + String.join(", ", manager.getSelectedChunks()), NamedTextColor.AQUA));
                      }
                      case "reload" -> {
                          plugin.reloadConfig();
                          manager.loadChunksFromConfig();
                          plugin.startTasks();
                          sender.sendMessage(Component.text("Конфигурация SnowChunks перезагружена!", NamedTextColor.GREEN));
                      }
                      default -> sendHelp(sender);
                  }
                  return true;
              }

              private void handleSpeedCommand(CommandSender sender, String[] args, boolean isGrow) {
                  String cmdName = isGrow ? "growspeed" : "meltspeed";
                  String labelRu = isGrow ? "появления снежных слоёв" : "таяния снега";
                  String section = isGrow ? "snowdrifts" : "melting";
                  String chanceKey = isGrow ? "growth-chance" : "melt-chance";

                  if (args.length < 2) {
                      sender.sendMessage(Component.text("Использование: /sc " + cmdName + " [off|slow|normal|fast|turbo или число 0-256] [шанс%]", NamedTextColor.RED));
                      return;
                  }

                  String input = args[1].toLowerCase();
                  int attempts;
                  double chance = plugin.getConfig().getDouble(section + "." + chanceKey, isGrow ? 0.45 : 0.55);

                  switch (input) {
                      case "off", "0", "disable", "false" -> {
                          plugin.getConfig().set(section + ".enabled", false);
                          plugin.getConfig().set(section + ".attempts-per-chunk", 0);
                          plugin.saveConfig();
                          sender.sendMessage(Component.text("Процесс " + labelRu + " ОТКЛЮЧЁН.", NamedTextColor.YELLOW));
                          return;
                      }
                      case "slow" -> {
                          attempts = 3;
                          chance = 0.25;
                      }
                      case "normal" -> {
                          attempts = isGrow ? 10 : 12;
                          chance = isGrow ? 0.45 : 0.55;
                      }
                      case "fast" -> {
                          attempts = isGrow ? 25 : 30;
                          chance = isGrow ? 0.65 : 0.75;
                      }
                      case "turbo" -> {
                          attempts = isGrow ? 60 : 80;
                          chance = isGrow ? 0.85 : 0.90;
                      }
                      default -> {
                          try {
                              attempts = Integer.parseInt(input);
                              if (attempts < 1 || attempts > 256) {
                                  sender.sendMessage(Component.text("Скорость должна быть числом от 1 до 256 (или 0 для отключения).", NamedTextColor.RED));
                                  return;
                              }
                          } catch (NumberFormatException e) {
                              sender.sendMessage(Component.text("Укажите режим (off, slow, normal, fast, turbo) или число от 0 до 256.", NamedTextColor.RED));
                              return;
                          }
                      }
                  }

                  if (args.length >= 3) {
                      try {
                          double parsedChance = Double.parseDouble(args[2].replace("%", ""));
                          if (parsedChance > 1.0) {
                              parsedChance = parsedChance / 100.0;
                          }
                          chance = Math.max(0.01, Math.min(1.0, parsedChance));
                      } catch (NumberFormatException e) {
                          sender.sendMessage(Component.text("Некорректный формат шанса! Используйте проценты (например, 50) или дробь (0.5).", NamedTextColor.RED));
                          return;
                      }
                  }

                  plugin.getConfig().set(section + ".enabled", true);
                  if (isGrow) {
                      plugin.getConfig().set("accumulation.allow-snow-layers", true);
                  }
                  plugin.getConfig().set(section + ".attempts-per-chunk", attempts);
                  plugin.getConfig().set(section + "." + chanceKey, chance);
                  plugin.saveConfig();

                  int percentDisplay = (int) Math.round(chance * 100);
                  sender.sendMessage(Component.text("Скорость " + labelRu + " обновлена: "
                          + attempts + " попыток/чанк, шанс: " + percentDisplay + "%.", NamedTextColor.GREEN));
              }

              private void sendStatus(CommandSender sender) {
                  boolean growEnabled = plugin.getConfig().getBoolean("snowdrifts.enabled", true);
                  int growAttempts = plugin.getConfig().getInt("snowdrifts.attempts-per-chunk", 10);
                  int growChance = (int) Math.round(plugin.getConfig().getDouble("snowdrifts.growth-chance", 0.45) * 100);
                  int maxLayers = plugin.getConfig().getInt("snowdrifts.max-layers", 7);

                  boolean meltEnabled = plugin.getConfig().getBoolean("melting.enabled", true);
                  int meltAttempts = plugin.getConfig().getInt("melting.attempts-per-chunk", 12);
                  int meltChance = (int) Math.round(plugin.getConfig().getDouble("melting.melt-chance", 0.55) * 100);
                  long tickRate = plugin.getConfig().getLong("snowdrifts.interval-ticks", 20L);

                  sender.sendMessage(Component.text("--- Статус SnowChunks v1.4.1 ---", NamedTextColor.AQUA));
                  sender.sendMessage(Component.text("Активных чанков: " + manager.getSelectedChunks().size()
                          + " | Режим погоды: " + manager.getGlobalRolledMode().name(), NamedTextColor.WHITE));
                  sender.sendMessage(Component.text("Появление снега: " + (growEnabled ? "ВКЛ (" + growAttempts + " блок/цикл, шанс " + growChance + "%, макс. слоёв: " + maxLayers + ")" : "ВЫКЛ"), NamedTextColor.GREEN));
                  sender.sendMessage(Component.text("Таяние снега: " + (meltEnabled ? "ВКЛ (" + meltAttempts + " блок/цикл, шанс " + meltChance + "%)" : "ВЫКЛ"), NamedTextColor.AQUA));
                  sender.sendMessage(Component.text("Частота цикла физики: каждые " + tickRate + " тиков", NamedTextColor.GRAY));
              }

              private int parseRadius(String arg, Player player) {
                  try {
                      int r = Integer.parseInt(arg);
                      if (r < 0 || r > 10) {
                          player.sendMessage(Component.text("Радиус должен быть от 0 до 10.", NamedTextColor.RED));
                          return -1;
                      }
                      return r;
                  } catch (NumberFormatException e) {
                      player.sendMessage(Component.text("Введите корректное целое число.", NamedTextColor.RED));
                      return -1;
                  }
              }

              private void sendHelp(CommandSender sender) {
                  sender.sendMessage(Component.text("--- Команды SnowChunks v1.4.1 ---", NamedTextColor.AQUA));
                  sender.sendMessage(Component.text("/sc wand — получить жезл выбора и подсветки чанков", NamedTextColor.GRAY));
                  sender.sendMessage(Component.text("/sc borders — вкл/выкл подсветку границ частицами", NamedTextColor.GRAY));
                  sender.sendMessage(Component.text("/sc add / remove — добавить/удалить текущий чанк", NamedTextColor.GRAY));
                  sender.sendMessage(Component.text("/sc addradius [R] / removeradius [R] — чанки в радиусе", NamedTextColor.GRAY));
                  sender.sendMessage(Component.text("/sc growspeed [режим|0-256] [шанс%] — скорость появления снега", NamedTextColor.GRAY));
                  sender.sendMessage(Component.text("/sc meltspeed [режим|0-256] [шанс%] — скорость таяния снега", NamedTextColor.GRAY));
                  sender.sendMessage(Component.text("/sc tickrate [1-200] — частота обновления физики в тиках", NamedTextColor.GRAY));
                  sender.sendMessage(Component.text("/sc maxlayers [1-7] — задать макс. высоту сугробов", NamedTextColor.GRAY));
                  sender.sendMessage(Component.text("/sc meltsnow — мгновенно растопить весь снег в зонах", NamedTextColor.GRAY));
                  sender.sendMessage(Component.text("/sc setchance [snow|rain|thunder|clear] [вес] — шанс осадков", NamedTextColor.GRAY));
                  sender.sendMessage(Component.text("/sc roll / force [тип] — перебросить / включить осадки", NamedTextColor.GRAY));
                  sender.sendMessage(Component.text("/sc status / list / reload — статус, список чанков, перезагрузка", NamedTextColor.GRAY));
              }

              @Override
              public List<String> onTabComplete(CommandSender sender, Command command, String alias, String[] args) {
                  if (args.length == 1) {
                      return Arrays.asList("add", "remove", "addradius", "removeradius", "wand", "borders",
                              "growspeed", "meltspeed", "tickrate", "maxlayers", "meltsnow",
                              "roll", "force", "setchance", "status", "list", "reload");
                  }
                  if (args.length == 2) {
                      String sub = args[0].toLowerCase();
                      if (sub.equals("force") || sub.equals("setchance")) {
                          return Arrays.asList("snow", "rain", "thunder", "clear");
                      }
                      if (sub.equals("maxlayers")) {
                          return Arrays.asList("1", "2", "3", "4", "5", "6", "7");
                      }
                      if (sub.equals("growspeed") || sub.equals("snowspeed") || sub.equals("meltspeed")) {
                          return Arrays.asList("slow", "normal", "fast", "turbo", "off", "5", "15", "30", "60");
                      }
                      if (sub.equals("tickrate") || sub.equals("physicsinterval")) {
                          name:
                          return Arrays.asList("5", "10", "20", "40", "60");
                      }
                  }
                  if (args.length == 3) {
                      String sub = args[0].toLowerCase();
                      if (sub.equals("growspeed") || sub.equals("snowspeed") || sub.equals("meltspeed")) {
                          return Arrays.asList("25%", "50%", "75%", "100%");
                      }
                  }
                  return Collections.emptyList();
              }
          }
